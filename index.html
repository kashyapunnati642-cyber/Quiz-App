<!DOCTYPE html>
<html>
<head>
    <title>sample Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="startButton" onclick="startQuiz()">🎯 Start Quiz</button>

        <h1>Welcome to Quiz App</h1>

        <p id="score">Your Score: 0</p>

        <h2 id="question">Question will appear here 👇</h2>

        <div id="options">
            <button onclick="checkAnswer(0)">Option 1</button>
            <button onclick="checkAnswer(1)">Option 2</button>
            <button onclick="checkAnswer(2)">Option 3</button>
            <button onclick="checkAnswer(3)">Option 4</button>
        </div>

        <button id="nextButton" onclick="nextQuestion()">Next Question</button>
        <button id="restartButton" onclick="restartQuiz()">Restart Quiz</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
